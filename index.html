<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Project Tracker</title>
    
    <!-- 1. Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 2. Load React and ReactDOM libraries -->
    <script src="https://unpkg.com/react@17/umd/react.development.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js" crossorigin></script>
    
    <!-- 3. Load Babel (to translate JSX in the browser) -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  </head>
  
  <body class="bg-gray-900 text-white">
    <!-- This is where our React app will be attached -->
    <div id="root"></div>

    <!-- 
      4. START of our React code. 
    -->
    <script type="text/babel">
      
      const { useState, useMemo, useEffect } = React;

      // --- Icon Components ---

      const ArrowLeft = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
      );

      const X = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
      );

      const CheckSquare = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      );

      const Square = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect></svg>
      );

      const MoreVertical = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="1"></circle><circle cx="12" cy="5" r="1"></circle><circle cx="12" cy="19" r="1"></circle></svg>
      );

      const Plus = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
      );
      
      const Clock = (props) => (
         <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
      );

      const User = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      );

      const Trash = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
      );

      const Edit = (props) => (
        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" {...props}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
      );

      // --- Constants ---
      // Expanded palette with Golden Black, Pink, Brown, etc.
      const CARD_GRADIENTS = [
            "bg-gradient-to-br from-blue-600 to-indigo-700",       // Classic Blue
            "bg-gradient-to-br from-amber-500 to-neutral-900",     // Golden Black
            "bg-gradient-to-br from-pink-600 to-rose-800",         // Pink
            "bg-gradient-to-br from-emerald-600 to-teal-700",      // Emerald Green
            "bg-gradient-to-br from-amber-800 to-orange-900",      // Deep Brown
            "bg-gradient-to-br from-purple-600 to-indigo-800",     // Royal Purple
            "bg-gradient-to-br from-stone-600 to-neutral-800",     // Stone/Black
            "bg-gradient-to-br from-fuchsia-600 to-pink-700",      // Vivid Fuchsia
            "bg-gradient-to-br from-cyan-600 to-blue-800",         // Deep Ocean
            "bg-gradient-to-br from-red-600 to-rose-800",          // Crimson Red
            "bg-gradient-to-br from-lime-600 to-green-800",        // Olive/Lime
            "bg-gradient-to-br from-slate-600 to-gray-800",        // Steel Gray
            "bg-gradient-to-br from-violet-600 to-purple-800",     // Deep Violet
            "bg-gradient-to-br from-orange-600 to-red-700",        // Burnt Orange
            "bg-gradient-to-br from-teal-600 to-cyan-800",         // Dark Teal
            "bg-gradient-to-br from-indigo-500 to-blue-600"        // Indigo Blue
      ];

      // --- Initial Data ---
      const initialTasks = [
        { id: 1, name: 'Kick off meeting', status: 'not_completed', progress: 0, comment: '' },
        { id: 2, name: 'Data collection', status: 'not_completed', progress: 0, comment: '' },
        { id: 3, name: 'Modelling', status: 'not_completed', progress: 0, comment: '' },
        { id: 4, name: 'Model verification', status: 'not_completed', progress: 0, comment: '' },
        { id: 5, name: 'LF', status: 'not_completed', progress: 0, comment: '' },
        { id: 6, name: 'SC', status: 'not_completed', progress: 0, comment: '' },
        { id: 7, name: 'Coordination', status: 'not_completed', progress: 0, comment: '' },
        { id: 8, name: 'AF', status: 'not_completed', progress: 0, comment: '' },
      ];

      const initialProjects = []; 
      
      const PROJECTS_STORAGE_KEY = 'projectTrackerApp-projects';

      // --- Helper Function ---
      const calculateCompletion = (tasks) => {
        if (!tasks || tasks.length === 0) return 0;
        
        const specialWeights = {
            'Kick off meeting': 2,     
            'Model verification': 5    
        };

        let weightedScore = 0;
        let otherTasks = [];

        tasks.forEach(task => {
            if (specialWeights.hasOwnProperty(task.name)) {
                const weight = specialWeights[task.name];
                const progress = task.progress || 0;
                weightedScore += (progress / 100) * weight;
            } else {
                otherTasks.push(task);
            }
        });

        if (otherTasks.length > 0) {
            const remainingPercentage = 100 - 2 - 5; // 93%
            const weightPerOtherTask = remainingPercentage / otherTasks.length;
            
            otherTasks.forEach(task => {
                const progress = task.progress || 0;
                weightedScore += (progress / 100) * weightPerOtherTask;
            });
        }

        return Math.min(100, Math.round(weightedScore));
      };

      const getTitleForStatus = (status) => {
        switch (status) {
          case 'ongoing': return 'Active Projects';
          case 'pending': return 'New Projects';
          case 'suspended': return 'Pending Projects'; 
          case 'completed': return 'Completed Projects';
          default: return 'Projects';
        }
      };

      // --- Components ---

      const HomePage = ({ setPage, projects }) => {
        const activeCount = projects.filter(p => p.status === 'ongoing').length;
        const completedCount = projects.filter(p => p.status === 'completed').length;
        const newCount = projects.filter(p => p.status === 'pending').length;
        const suspendedCount = projects.filter(p => p.status === 'suspended').length;

        return (
          <div className="min-h-screen p-8 md:p-12 flex flex-col justify-center items-center bg-gradient-to-br from-gray-900 to-gray-800">
            <h1 className="text-4xl md:text-5xl font-extrabold mb-12 text-center text-white tracking-tight">
              Project Tracking Dashboard
            </h1>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl">
              <HomeCard 
                title="Active Projects" 
                count={activeCount} 
                color="bg-gradient-to-br from-blue-600 to-indigo-700" 
                onClick={() => setPage('ongoing')} 
              />
              <HomeCard 
                title="New Projects" 
                count={newCount} 
                color="bg-gradient-to-br from-purple-600 to-fuchsia-700" 
                onClick={() => setPage('pending')} 
              />
              <HomeCard 
                title="Pending Project" 
                count={suspendedCount} 
                color="bg-gradient-to-br from-rose-600 to-red-700" 
                onClick={() => setPage('suspended')} 
              />
              <HomeCard 
                title="Completed Projects" 
                count={completedCount} 
                color="bg-gradient-to-br from-emerald-500 to-green-600" 
                onClick={() => setPage('completed')} 
              />
            </div>
          </div>
        );
      };

      const HomeCard = ({ title, count, color, onClick }) => (
        <div className={`p-6 ${color} text-white rounded-xl shadow-xl cursor-pointer transform transition-all duration-300 hover:scale-105 hover:shadow-2xl border border-white/10`} onClick={onClick}>
          <h2 className="text-lg font-medium truncate opacity-90">{title}</h2>
          <p className="text-4xl font-bold mt-3">{count}</p>
        </div>
      );

      const ProjectListPage = ({ setPage, projects, status, setSelectedProjectId, onUpdateStatus, onOpenAddModal, onDeleteProject, onEditProject }) => {
        const projectList = useMemo(() => {
          return projects.filter(p => p.status === status);
        }, [projects, status]);

        const title = getTitleForStatus(status);

        return (
          <div className="p-8 min-h-screen">
            <Header 
              title={title} 
              onBack={() => setPage('home')}
              showAddButton={status === 'pending'} 
              onAdd={onOpenAddModal}
            />
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mt-8">
              {projectList.length === 0 ? (
                <div className="col-span-full flex flex-col items-center justify-center py-20 text-gray-400">
                    <p className="text-lg">No projects in this category.</p>
                </div>
              ) : (
                projectList.map((project, index) => (
                  <ProjectCard
                    key={project.id}
                    project={project}
                    // Use the persisted color. Fallback to index based for old data.
                    colorClass={project.color || CARD_GRADIENTS[index % CARD_GRADIENTS.length]}
                    onUpdateStatus={onUpdateStatus}
                    onDelete={onDeleteProject}
                    onEdit={onEditProject}
                    onClick={() => {
                      if (status === 'ongoing' || status === 'completed' || status === 'suspended') {
                        setSelectedProjectId(project.id);
                        setPage('detail');
                      }
                    }}
                  />
                ))
              )}
            </div>
          </div>
        );
      };

      const ProjectCard = ({ project, colorClass, onClick, onUpdateStatus, onDelete, onEdit }) => {
        const completion = useMemo(() => calculateCompletion(project.tasks), [project.tasks]);
        const [menuOpen, setMenuOpen] = useState(false);
        
        // --- Days Calculation ---
        let daysRemaining = 0;
        let timePercentage = 0;
        let isOverdue = false;

        if (project.status === 'ongoing' && project.startDate && project.duration) {
            const oneDay = 24 * 60 * 60 * 1000;
            const elapsedDays = (Date.now() - project.startDate) / oneDay;
            daysRemaining = Math.ceil(project.duration - elapsedDays);
            timePercentage = Math.min(100, Math.max(0, (daysRemaining / project.duration) * 100));
            
            if (daysRemaining < 0) {
                isOverdue = true;
                daysRemaining = Math.abs(daysRemaining);
            }
        }

        const handleCloseProject = (e) => { e.stopPropagation(); if (completion === 100) onUpdateStatus(project.id, 'completed'); setMenuOpen(false); };
        const handleStartProject = (e) => { e.stopPropagation(); onUpdateStatus(project.id, 'ongoing'); setMenuOpen(false); };
        const handleMoveToPending = (e) => { e.stopPropagation(); onUpdateStatus(project.id, 'suspended'); setMenuOpen(false); };
        const handleResumeProject = (e) => { e.stopPropagation(); onUpdateStatus(project.id, 'ongoing'); setMenuOpen(false); };
        const handleDeleteProject = (e) => { e.stopPropagation(); onDelete(project.id); setMenuOpen(false); };
        const handleEditProject = (e) => { e.stopPropagation(); onEdit(project); setMenuOpen(false); };
        
        const toggleMenu = (e) => { 
            e.preventDefault();
            e.stopPropagation(); 
            setMenuOpen(prev => !prev); 
        };

        const closeMenu = (e) => {
            if (e) {
                e.preventDefault();
                e.stopPropagation();
            }
            setMenuOpen(false);
        };

        // Using colorClass instead of fixed bg-gray-800
        return (
          <div
            className={`p-6 ${colorClass || 'bg-gray-800'} border border-white/20 rounded-xl shadow-lg relative ${menuOpen ? 'z-50 scale-105' : 'z-0'} ${project.status !== 'pending' && !menuOpen ? 'cursor-pointer transform hover:scale-105 transition-all duration-200' : ''}`}
            onClick={onClick}
          >
            {/* Menus */}
            <div className="absolute top-4 right-4 z-50">
               <button onClick={toggleMenu} className="p-2 rounded-full text-white/70 hover:bg-black/20 hover:text-white transition-colors relative z-50">
                   <MoreVertical className="w-5 h-5" />
               </button>
               
               {menuOpen && (
                  <>
                    {/* Invisible Backdrop to handle click-outside */}
                    <div className="fixed inset-0 z-40 cursor-default" onClick={closeMenu}></div>

                    {/* Menu Dropdown */}
                    <div className="absolute right-0 mt-2 w-56 bg-gray-800 border border-gray-700 rounded-md shadow-2xl z-50 overflow-hidden">
                        
                        {/* Active Project Options */}
                        {project.status === 'ongoing' && (
                            <>
                                <button onClick={handleEditProject} className="w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700 flex items-center">
                                    <Edit className="w-4 h-4 mr-2" /> Edit Project Details
                                </button>
                                <button onClick={handleMoveToPending} className="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Move to Pending Project</button>
                                <button onClick={handleCloseProject} className={`block w-full text-left px-4 py-2 text-sm ${completion === 100 ? 'text-gray-300 hover:bg-gray-700' : 'text-gray-500 cursor-not-allowed'}`} disabled={completion !== 100}>Close Project</button>
                            </>
                        )}
                        
                        {/* New Project Options */}
                        {project.status === 'pending' && (
                            <button onClick={handleStartProject} className="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Start Project</button>
                        )}
                        
                        {/* Suspended Project Options */}
                        {project.status === 'suspended' && (
                            <button onClick={handleResumeProject} className="block w-full text-left px-4 py-2 text-sm text-gray-300 hover:bg-gray-700">Resume Project</button>
                        )}
                        
                        {/* Delete is available for all */}
                        <div className="border-t border-gray-700 mt-1">
                            <button onClick={handleDeleteProject} className="w-full text-left px-4 py-2 text-sm text-red-400 hover:bg-gray-700 hover:text-red-300 flex items-center">
                                <Trash className="w-4 h-4 mr-2" /> Delete Project
                            </button>
                        </div>
                    </div>
                  </>
               )}
            </div>

            <h3 className="text-xl font-bold text-white pr-8 mb-2 drop-shadow-md">{project.name}</h3>
            
            {/* Manager Name */}
            {project.manager && (
                <div className="flex items-center text-white/80 text-sm mb-4">
                    <User className="w-4 h-4 mr-2" />
                    <span>{project.manager}</span>
                </div>
            )}

            {/* Logic for Active Projects (Bar charts) */}
            {project.status === 'ongoing' && (
              <div className="space-y-4">
                {/* Task Progress */}
                <div>
                    <div className="flex justify-between items-center mb-1">
                        <span className="text-xs font-medium text-white/80">Task Completion</span>
                        <span className="text-xs font-bold text-white">{completion}%</span>
                    </div>
                    {/* Using bg-black/20 for the track so it looks good on gradients */}
                    <div className="w-full bg-black/20 rounded-full h-2 border border-white/10">
                        <div className="bg-white h-2 rounded-full shadow-sm" style={{ width: `${completion}%` }}></div>
                    </div>
                </div>

                {/* Days Remaining Bar */}
                {project.duration && (
                    <div>
                        <div className="flex justify-between items-center mb-1">
                            <span className="text-xs font-medium text-white/80 flex items-center">
                                <Clock className="w-3 h-3 mr-1" />
                                {isOverdue ? 'Overdue by' : 'Time Remaining'}
                            </span>
                            <span className={`text-xs font-bold ${isOverdue ? 'text-red-200' : 'text-white'}`}>
                                {daysRemaining} days
                            </span>
                        </div>
                        <div className="w-full bg-black/20 rounded-full h-2 border border-white/10">
                            <div 
                                className={`${isOverdue ? 'bg-red-400' : 'bg-yellow-300'} h-2 rounded-full transition-all duration-500 shadow-sm`} 
                                style={{ width: isOverdue ? '100%' : `${timePercentage}%` }}
                            ></div>
                        </div>
                    </div>
                )}
              </div>
            )}
            
            {/* Completed Status */}
            {project.status === 'completed' && (
                <div className="mt-4 px-3 py-1 bg-white/20 border border-white/30 text-white text-sm rounded-full inline-block font-bold shadow-sm">
                    Completed
                </div>
            )}
             {project.status === 'suspended' && (
                <div className="mt-4 px-3 py-1 bg-black/20 border border-white/20 text-white text-sm rounded-full inline-block font-medium">
                    Pending / Suspended
                </div>
            )}
             {project.status === 'pending' && (
                <div className="mt-4">
                    <span className="text-sm text-white/80 font-medium">Duration: {project.duration} days</span>
                </div>
            )}

          </div>
        );
      };

      const ProjectDetailPage = ({ setPage, project, openModal, closeProject }) => {
        const completion = useMemo(() => calculateCompletion(project.tasks), [project.tasks]);
        
        // Re-using the global palette for consistency
        const cardGradients = CARD_GRADIENTS;

        const getStatusText = (task) => {
            const p = task.progress || 0;
            if (p === 100) return 'Completed';
            if (p === 0) return 'Not Started';
            return `${p}% Completed`;
        };
        
        const getStatusTextColor = (task) => {
          const p = task.progress || 0;
          if (p === 100) return 'text-white/90 font-bold';
          if (p > 0) return 'text-white/90 font-semibold';
          return 'text-white/70';
        };

        return (
          <div className="p-8 min-h-screen">
            <Header title={project.name} onBack={() => setPage(project.status)} />
            <div className="my-6 p-6 bg-gray-800 border border-gray-700 rounded-xl shadow-lg">
              <div className="flex justify-between items-center mb-3">
                  <span className="text-lg font-medium text-gray-300">Overall Progress</span>
                  <span className={`text-lg font-bold ${completion === 100 ? 'text-green-400' : 'text-blue-400'}`}>{completion}%</span>
              </div>
              <div className="w-full bg-gray-700 rounded-full h-4">
                  <div className={`${completion === 100 ? 'bg-green-500' : 'bg-blue-500'} h-4 rounded-full transition-all duration-500`} style={{ width: `${completion}%` }}></div>
              </div>
            </div>
            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
              {project.tasks.map((task, index) => (
                <div 
                    key={task.id} 
                    className={`p-5 rounded-xl shadow-lg cursor-pointer hover:scale-105 transition-transform duration-200 border border-white/10 ${cardGradients[index % cardGradients.length]}`} 
                    onClick={() => openModal(task)}
                >
                  <div className="flex justify-between items-start">
                    <h4 className="text-lg font-bold text-white tracking-wide drop-shadow-sm">{task.name}</h4>
                    <span className="bg-black/20 px-2 py-1 rounded text-xs font-bold text-white">{task.progress || 0}%</span>
                  </div>
                  <p className={`text-sm mt-2 ${getStatusTextColor(task)}`}>{getStatusText(task)}</p>
                  {task.comment && (<p className="text-sm text-white/80 mt-2 italic truncate border-t border-white/20 pt-2">"{task.comment}"</p>)}
                </div>
              ))}
            </div>
            {completion === 100 && project.status === 'ongoing' && (
              <div className="mt-8 flex justify-center">
                <button onClick={closeProject} className="px-6 py-3 bg-green-600 text-white font-semibold rounded-lg shadow-md hover:bg-green-700 transition-colors">Close Project</button>
              </div>
            )}
          </div>
        );
      };

      const Header = ({ title, onBack, showAddButton, onAdd }) => (
        <div className="flex items-center justify-between mb-6">
          <div className="flex items-center">
            <button onClick={onBack} className="p-2 rounded-full hover:bg-gray-800 text-white transition-colors mr-4"><ArrowLeft /></button>
            <h1 className="text-3xl font-bold text-white">{title}</h1>
          </div>
          {showAddButton && (
            <button onClick={onAdd} className="p-2 rounded-full bg-blue-600 text-white shadow-lg hover:bg-blue-700 transition-colors" title="Add New Project"><Plus className="w-6 h-6" /></button>
          )}
        </div>
      );

      const TaskModal = ({ isOpen, closeModal, task, saveTask }) => {
        const [progress, setProgress] = useState(0);
        const [comment, setComment] = useState('');
        const [showComment, setShowComment] = useState(false);

        useEffect(() => { 
            if (task) { 
                setProgress(task.progress || 0); 
                setComment(task.comment); 
                setShowComment(!!task.comment); 
            } 
        }, [task]);

        if (!isOpen || !task) return null;
        
        const handleSave = () => { 
            const finalProgress = Math.min(100, Math.max(0, parseInt(progress) || 0));
            saveTask(task.id, finalProgress, showComment ? comment : ''); 
            closeModal(); 
        };

        return (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div className="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-8 w-full max-w-lg">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold text-white">{task.name}</h2>
                <button onClick={closeModal} className="p-1 rounded-full hover:bg-gray-700 text-gray-400 hover:text-white"><X /></button>
              </div>
              
              <div className="space-y-6">
                <div>
                    <h3 className="text-lg font-semibold text-gray-300 mb-3">Update Progress (%)</h3>
                    <div className="flex items-center">
                        <input 
                            type="number" 
                            min="0" 
                            max="100" 
                            value={progress} 
                            onChange={(e) => setProgress(e.target.value)} 
                            className="w-full px-4 py-3 bg-gray-900 border border-gray-600 rounded-lg text-white text-xl font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none"
                        />
                        <span className="ml-3 text-xl text-gray-400">%</span>
                    </div>
                    <div className="w-full bg-gray-700 rounded-full h-2 mt-4">
                        <div className="bg-blue-500 h-2 rounded-full transition-all" style={{ width: `${Math.min(100, Math.max(0, progress))}%` }}></div>
                    </div>
                </div>

                <div className="pt-4 border-t border-gray-700">
                  <label className="flex items-center cursor-pointer text-gray-300">
                    <input type="checkbox" className="hidden" checked={showComment} onChange={() => setShowComment(!showComment)} />
                    {showComment ? <CheckSquare className="text-blue-400 mr-2" /> : <Square className="text-gray-500 mr-2" />}
                    <span>Add/Edit Comment</span>
                  </label>
                  {showComment && (
                      <textarea 
                          value={comment} 
                          onChange={(e) => setComment(e.target.value)} 
                          className="w-full h-24 p-3 mt-3 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none resize-none" 
                          placeholder="Enter your comment..."
                      ></textarea>
                  )}
                </div>
              </div>

              <div className="mt-8 flex justify-end space-x-4">
                <button onClick={closeModal} className="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Progress</button>
              </div>
            </div>
          </div>
        );
      };

      const AddProjectModal = ({ isOpen, onClose, onSave }) => {
        const [name, setName] = useState('');
        const [days, setDays] = useState('');
        const [manager, setManager] = useState('');

        const handleSave = () => { 
            if (name.trim() && days && manager.trim()) { 
                onSave(name.trim(), parseInt(days), manager.trim()); 
                setName(''); setDays(''); setManager(''); onClose(); 
            } 
        };
        const handleCancel = () => { setName(''); setDays(''); setManager(''); onClose(); }
        if (!isOpen) return null;

        return (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div className="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-8 w-full max-w-lg">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold text-white">Add New Project</h2>
                <button onClick={handleCancel} className="p-1 rounded-full hover:bg-gray-700 text-gray-400 hover:text-white"><X /></button>
              </div>
              
              <div className="space-y-4">
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Project Name</label>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" placeholder="e.g., Project Omega" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Project Manager Name</label>
                    <input type="text" value={manager} onChange={(e) => setManager(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" placeholder="e.g., John Doe" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Duration (Days)</label>
                    <input type="number" value={days} onChange={(e) => setDays(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" placeholder="e.g., 30" />
                </div>
              </div>

              <div className="mt-8 flex justify-end space-x-4">
                <button onClick={handleCancel} className="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors">Cancel</button>
                <button onClick={handleSave} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Project</button>
              </div>
            </div>
          </div>
        );
      };

      const EditProjectModal = ({ isOpen, onClose, onSave, project }) => {
        const [name, setName] = useState('');
        const [days, setDays] = useState('');
        const [manager, setManager] = useState('');

        useEffect(() => {
            if (project) {
                setName(project.name);
                setDays(project.duration);
                setManager(project.manager);
            }
        }, [project]);

        const handleSave = () => { 
            if (name.trim() && days && manager.trim()) { 
                onSave(project.id, { name: name.trim(), duration: parseInt(days), manager: manager.trim() }); 
                onClose(); 
            } 
        };
        
        if (!isOpen || !project) return null;

        return (
          <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-50 p-4 backdrop-blur-sm">
            <div className="bg-gray-800 border border-gray-700 rounded-xl shadow-2xl p-8 w-full max-w-lg">
              <div className="flex justify-between items-center mb-6">
                <h2 className="text-2xl font-bold text-white">Edit Project Details</h2>
                <button onClick={onClose} className="p-1 rounded-full hover:bg-gray-700 text-gray-400 hover:text-white"><X /></button>
              </div>
              
              <div className="space-y-4">
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Project Name</label>
                    <input type="text" value={name} onChange={(e) => setName(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Project Manager Name</label>
                    <input type="text" value={manager} onChange={(e) => setManager(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" />
                </div>
                <div>
                    <label className="block text-sm font-medium text-gray-400 mb-1">Duration (Days)</label>
                    <input type="number" value={days} onChange={(e) => setDays(e.target.value)} className="block w-full px-4 py-2 bg-gray-900 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 focus:border-transparent focus:outline-none" />
                </div>
              </div>

              <div className="mt-8 flex justify-end space-x-4">
                <button onClick={onClose} className="px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-600 transition-colors">Cancel</button>
                <button onClick={onClose} className="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors">Save Changes</button>
              </div>
            </div>
          </div>
        );
      };

      // --- Main App ---
      function App() {
        const [page, setPage] = useState('home'); 
        const [projects, setProjects] = useState(() => {
          const savedProjects = localStorage.getItem(PROJECTS_STORAGE_KEY);
          if (savedProjects) {
            try { return JSON.parse(savedProjects); } catch (e) { return initialProjects; }
          }
          return initialProjects;
        });

        const [selectedProjectId, setSelectedProjectId] = useState(null);
        const [modalTask, setModalTask] = useState(null);
        const [isAddModalOpen, setIsAddModalOpen] = useState(false);
        const [isEditModalOpen, setIsEditModalOpen] = useState(false);
        const [editingProject, setEditingProject] = useState(null);

        useEffect(() => { localStorage.setItem(PROJECTS_STORAGE_KEY, JSON.stringify(projects)); }, [projects]);
        const selectedProject = useMemo(() => projects.find(p => p.id === selectedProjectId), [projects, selectedProjectId]);
        const openModal = (task) => setModalTask(task);
        const closeModal = () => setModalTask(null);

        const addProject = (name, days, manager) => {
          // Assign a permanent color from the palette based on how many projects exist
          const color = CARD_GRADIENTS[projects.length % CARD_GRADIENTS.length];
          const newProject = {
            id: Date.now(),
            name: name,
            manager: manager,
            duration: days,
            startDate: null, // Not started yet
            status: 'pending',
            color: color, // Persist the color
            tasks: []
          };
          setProjects(prevProjects => [...prevProjects, newProject]);
          setIsAddModalOpen(false);
        };
        
        const deleteProject = (id) => {
            if(confirm('Are you sure you want to delete this project? This action cannot be undone.')) {
                 setProjects(prevProjects => prevProjects.filter(p => p.id !== id));
            }
        };
        
        const openEditModal = (project) => {
            setEditingProject(project);
            setIsEditModalOpen(true);
        };

        const updateProjectDetails = (id, updatedData) => {
            setProjects(prevProjects => prevProjects.map(p => p.id === id ? { ...p, ...updatedData } : p));
        };

        const updateProjectStatus = (id, newStatus) => {
          setProjects(prevProjects =>
            prevProjects.map(p => {
              if (p.id !== id) return p;
              let updates = { status: newStatus };

              // When moving from pending to ongoing, populate tasks and set startDate
              if (p.status === 'pending' && newStatus === 'ongoing') {
                const newTasks = JSON.parse(JSON.stringify(initialTasks)).map((t, index) => ({...t, id: `p${p.id}-t${index + 1}`}));
                updates.tasks = newTasks;
                updates.startDate = Date.now(); 
              }
              
              // If resuming from suspended (or anywhere) and startDate is missing, start the clock now
              if (newStatus === 'ongoing' && !p.startDate) {
                 updates.startDate = Date.now();
              }

              return { ...p, ...updates };
            })
          );
        };
        
        const saveTask = (taskId, newProgress, newComment) => {
          setProjects(prevProjects =>
            prevProjects.map(project => {
              if (project.id !== selectedProjectId) return project;
              
              // Determine status text from progress number for backward compatibility
              let derivedStatus = 'not_completed';
              if (newProgress === 100) derivedStatus = 'completed';
              else if (newProgress > 0) derivedStatus = 'working_on_it';

              const newTasks = project.tasks.map(task => task.id === taskId ? { 
                  ...task, 
                  progress: newProgress, // Save numerical progress
                  status: derivedStatus, // Save derived text status
                  comment: newComment 
                } : task);
              
              const newCompletion = calculateCompletion(newTasks);
              let updatedStatus = project.status;
              if (project.status === 'completed' && newCompletion < 100) updatedStatus = 'ongoing';
              return { ...project, tasks: newTasks, status: updatedStatus };
            })
          );
        };

        const closeProjectFromDetail = () => { updateProjectStatus(selectedProjectId, 'completed'); setPage('ongoing'); };

        const renderPage = () => {
          switch (page) {
            case 'home': return <HomePage setPage={setPage} projects={projects} />;
            case 'ongoing': return <ProjectListPage setPage={setPage} projects={projects} status="ongoing" setSelectedProjectId={setSelectedProjectId} onUpdateStatus={updateProjectStatus} onDeleteProject={deleteProject} onEditProject={openEditModal} />;
            case 'completed': return <ProjectListPage setPage={setPage} projects={projects} status="completed" setSelectedProjectId={setSelectedProjectId} onUpdateStatus={updateProjectStatus} onDeleteProject={deleteProject} onEditProject={openEditModal} />;
            case 'pending': return <ProjectListPage setPage={setPage} projects={projects} status="pending" setSelectedProjectId={setSelectedProjectId} onUpdateStatus={updateProjectStatus} onOpenAddModal={() => setIsAddModalOpen(true)} onDeleteProject={deleteProject} onEditProject={openEditModal} />;
            case 'suspended': return <ProjectListPage setPage={setPage} projects={projects} status="suspended" setSelectedProjectId={setSelectedProjectId} onUpdateStatus={updateProjectStatus} onDeleteProject={deleteProject} onEditProject={openEditModal} />;
            case 'detail': return selectedProject ? <ProjectDetailPage setPage={setPage} project={selectedProject} openModal={openModal} closeProject={closeProjectFromDetail} /> : (setPage('home'), null);
            default: return <HomePage setPage={setPage} projects={projects} />;
          }
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-gray-900 to-gray-800 text-white selection:bg-blue-500 selection:text-white">
            {renderPage()}
            <TaskModal isOpen={!!modalTask} closeModal={closeModal} task={modalTask} saveTask={saveTask} />
            <AddProjectModal isOpen={isAddModalOpen} onClose={() => setIsAddModalOpen(false)} onSave={addProject} />
            <EditProjectModal isOpen={isEditModalOpen} onClose={() => setIsEditModalOpen(false)} onSave={updateProjectDetails} project={editingProject} />
          </div>
        );
      }
      
      ReactDOM.render(<App />, document.getElementById('root'));

    </script>
  </body>
</html>
